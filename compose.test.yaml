name: cocos-challenge-tests
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: cocos_test
      POSTGRES_PASSWORD: cocos_test
      POSTGRES_DB: cocos_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/postgres/database.sql:/docker-entrypoint-initdb.d/001-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocos_test -d cocos_test"]
      interval: 2s
      timeout: 3s
      retries: 20
